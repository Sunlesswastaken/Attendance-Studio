# Render Blueprint for Attendance Studio.
# Create a new Blueprint instance from this repo and Render provisions the
# Docker web service below. Secret values (sync: false) are prompted for in
# the dashboard and are never stored in the repo.
services:
  - type: web
    name: attendance-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free plan: no card required, but the service spins down after 15 min idle
    # (about a minute to wake). That clears in-memory logins and cached reports,
    # so users sign in again after idle. Switch to "starter" ($7/mo) for an
    # always-on instance. Note: the free plan shares 750 instance-hours/month
    # across the whole workspace, so avoid running two always-on free services.
    plan: free
    healthCheckPath: /api/health
    # Exactly one instance: sessions and cached reports live in process memory.
    numInstances: 1
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: OPEN_BROWSER
        value: "0"
      - key: COOKIE_SECURE
        value: "1"
      - key: NOMINAL_ROLLS_DIR
        value: /app/NOMINAL ROLLS
      - key: ATTENDANCE_TEST_USERNAME
        sync: false
      - key: ATTENDANCE_TEST_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
